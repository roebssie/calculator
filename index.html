<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Calculator with Dark Mode</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --calc-bg: white;
            --text-color: black;
            --btn-bg: #e0e0e0;
        }
        body.dark-mode {
            --bg-color: #1a1a1a;
            --calc-bg: #333;
            --text-color: white;
            --btn-bg: #444;
        }
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: var(--bg-color); 
            color: var(--text-color);
            transition: background 0.3s, color 0.3s;
        }
        .calculator { 
            background: var(--calc-bg); 
            padding: 20px; 
            border-radius: 10px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        #display { 
            width: 100%; 
            height: 40px; 
            font-size: 1.5em; 
            text-align: right; 
            margin-bottom: 10px; 
            background: var(--btn-bg);
            color: var(--text-color);
            border: 1px solid #ccc;
        }
        .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        button { 
            padding: 15px; 
            font-size: 1.2em; 
            cursor: pointer; 
            background: var(--btn-bg);
            color: var(--text-color);
            border: none;
            border-radius: 5px;
        }
        button:hover { opacity: 0.8; }
        .toggle-container { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="toggle-container">
        <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
    </div>
    <div class="calculator">
        <input type="text" id="display" disabled>
        <div class="buttons">
            <button onclick="clearDisplay()">C</button>
            <button onclick="appendValue('/')">/</button>
            <button onclick="appendValue('*')">*</button>
            <button onclick="appendValue('-')">-</button>
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('+')">+</button>
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="calculate()">=</button>
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('0')">0</button>
        </div>
    </div>
    <script>
        const display = document.getElementById('display');
        function appendValue(val) { display.value += val; }
        function clearDisplay() { display.value = ''; }
        function calculate() { try { display.value = eval(display.value); } catch { display.value = 'Error'; } }
        
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDark);
        }

        // Initialize theme
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
        }
    </script>
</body>
</html>
